# Report battery level to your computer
CONFIG_ZMK_BATTERY_REPORTING=y

# Also show the right half's battery (it reports through the left)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Deep sleep after 15 minutes idle — important since there's no power switch
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
